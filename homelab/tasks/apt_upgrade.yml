---
- name: Upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    autoclean: true
  register: apt_upgrade

- name: Show upgraded packages
  ansible.builtin.debug:
    msg: "{{ apt_upgrade.stdout_lines | select('match', '^Setting up ') | list }}"
  when: apt_upgrade.changed

# Ubuntu writes this file after upgrades that need a reboot, Debian/Proxmox don't
- name: Check for reboot-required flag
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

# Catches a new kernel on hosts that don't write the reboot-required flag.
# No pipefail: LXC containers use the Proxmox host's kernel and have none in /boot, which leaves stdout empty.
- name: Find newest installed kernel
  ansible.builtin.shell: ls -1 /boot/vmlinuz-* 2> /dev/null | sort -V | tail -n 1
  register: newest_kernel
  changed_when: false

- name: Decide if a reboot is needed
  ansible.builtin.set_fact:
    reboot_needed: >-
      {{ reboot_required_file.stat.exists
         or (newest_kernel.stdout != ''
             and (newest_kernel.stdout | basename) != ('vmlinuz-' ~ ansible_facts['kernel'])) }}
