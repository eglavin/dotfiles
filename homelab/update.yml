---
- name: Update Ubuntu hosts
  hosts: ubuntu
  become: true
  serial: 1

  tasks:
    - name: Upgrade packages
      ansible.builtin.include_tasks: tasks/apt_upgrade.yml

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_needed and auto_reboot | bool

    - name: Report pending reboot
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs a reboot"
      when: reboot_needed and not auto_reboot | bool

- name: Update Proxmox host
  hosts: proxmox
  become: true
  serial: 1

  tasks:
    - name: Upgrade packages
      ansible.builtin.include_tasks: tasks/apt_upgrade.yml

    # Never rebooted automatically, it would take every VM down mid-run
    - name: Report pending reboot
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs a reboot, do it manually when the VMs can go down"
      when: reboot_needed
