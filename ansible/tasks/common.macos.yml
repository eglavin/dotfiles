---
- name: Load macOS variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/macos.yml"

- name: Refresh homebrew
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true

- name: Install homebrew packages
  community.general.homebrew:
    name: "{{ homebrew_packages | enabled_items(active_tags) | map(attribute='name') }}"
    state: present

- name: Install mise tools
  ansible.builtin.command: /opt/homebrew/bin/mise install --yes
  changed_when: false
  tags: mise_tools
  when: "'mise_tools' in active_tags"
