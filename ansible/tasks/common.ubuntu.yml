---
- name: Load Ubuntu variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/ubuntu.yml"

- name: Refresh apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
  become: true

- name: Install optional apt packages
  ansible.builtin.apt:
    name: "{{ optional_apt_packages }}"
    state: present
  become: true
  tags: [never, optional]

- name: Set zsh is the default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "/usr/bin/zsh"
  become: true

- name: Create ~/.local/bin
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install GitHub release tools
  ansible.builtin.include_tasks: github_release.yml
  loop: "{{ github_release_tools }}"
  loop_control:
    loop_var: tool
    label: "{{ tool.repo }}"

# Tags on a dynamic include only select the include itself; `apply` passes them to the included tasks
- name: Install optional GitHub release tools
  ansible.builtin.include_tasks:
    file: github_release.yml
    apply:
      tags: [optional]
  loop: "{{ optional_github_release_tools }}"
  loop_control:
    loop_var: tool
    label: "{{ tool.repo }}"
  tags: [never, optional]

- name: Install mise tools
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/mise install --yes"
  changed_when: false
  tags: [never, mise_tools]

# Keep this last: the upgrade can replace ansible itself, which breaks any tasks run after it
- name: Upgrade apt packages
  ansible.builtin.apt:
    upgrade: safe
  become: true
