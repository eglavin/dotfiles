---
- name: Load Ubuntu variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/ubuntu.yml"

- name: Refresh and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
  become: true

- name: Set zsh is the default shell
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: "/usr/bin/zsh"
  become: true

- name: Create ~/.local/bin
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install GitHub release tools
  ansible.builtin.include_tasks: github_release.yml
  loop: "{{ github_release_tools }}"
  loop_control:
    loop_var: tool
    label: "{{ tool.repo }}"

- name: Install mise tools
  ansible.builtin.command: "{{ ansible_user_dir }}/.local/bin/mise install --yes"
  changed_when: false
