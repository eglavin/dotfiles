---
- name: Load Debian variables
  ansible.builtin.include_vars: "{{ playbook_dir }}/vars/debian.yml"

- name: Refresh apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages | enabled_items(active_tags) | map(attribute='name') }}"
    state: present
  become: true

# Provides add-apt-repository for PPAs, which only exist on Ubuntu (and Debian 13 dropped the package)
- name: Install Ubuntu apt packages
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  become: true
  when: ansible_facts["distribution"] == "Ubuntu"

- name: Set zsh is the default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "/usr/bin/zsh"
  become: true

- name: Create ~/.local/bin
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install GitHub release tools
  ansible.builtin.include_tasks: github_release.yml
  loop: "{{ github_release_tools | enabled_items(active_tags) }}"
  loop_control:
    loop_var: tool
    label: "{{ tool.repo }}"

- name: Install mise tools
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/mise install --yes"
  changed_when: false
  tags: mise_tools
  when: "'mise_tools' in active_tags"

# Keep this last: the upgrade can replace ansible itself, which breaks any tasks run after it
- name: Upgrade apt packages
  ansible.builtin.apt:
    upgrade: safe
  become: true
